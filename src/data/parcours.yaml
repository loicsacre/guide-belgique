  - id: economie
    emoji: "📚"
    title: "Économie et comptabilité"
    intro: "Les mots des entreprises et de l'économie, sans jargon inutile."
    presentation: "Bilan, marge, trésorerie, amortissement : ces mots reviennent dès qu'on parle d'une entreprise, et PIB, croissance ou banque centrale dès qu'on écoute les nouvelles. Ce chapitre en donne le sens et montre comment ils s'articulent, de la comptabilité d'une petite société à la politique monétaire."
    fil: "Chiffre d'affaires → bénéfice → trésorerie → amortissement → bilan → PIB et croissance → banque centrale"
