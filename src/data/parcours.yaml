  - id: ponts
    emoji: "🔗"
    title: "Les mots qui relient tout"
    intro: "Des mots qui changent de sens d'un domaine à l'autre."
    presentation: "Revenu, dette, contrat, responsabilité, statut familial, résidence : ces mots semblent simples, mais chacun change de sens selon qu'on parle à l'employeur, au fisc, à la banque ou à la mutualité. Ce chapitre se lit après les autres, ou chaque fois qu'un mot familier semble soudain dire autre chose."
    situations: []
    notions:
      - { slug: revenu, title: "Revenu : brut, net, imposable, disponible, cadastral… le même mot, six sens" }
      - { slug: dette, title: "Dette : la même chose vue par toi, la banque, le fisc et l'entreprise" }
      - { slug: contrat, title: "Contrat : ce qui lie, du bail au CDI en passant par l'assurance" }
      - { slug: responsabilite, title: "Responsabilité : civile, contractuelle, pénale, limitée" }
