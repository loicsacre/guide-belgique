      - { slug: droits-de-succession, title: Droits de succession }
      - { slug: donation, title: Donation et droits de donation }
  - id: entreprise
    emoji: "👨‍💻"
    title: "Indépendant et société"
    intro: "Travailler pour ton compte, seul ou en société."
    presentation: "Devenir indépendant, c'est devenir à la fois ton employeur, ton comptable et ton percepteur de TVA. Ce chapitre explique ce statut, puis l'étape que beaucoup envisagent ensuite : la société. On y voit pourquoi elle peut payer moins d'impôt, et pourquoi cet avantage n'existe que pour l'argent que l'on ne sort pas."
    fil: "Indépendant → BCE → cotisations sociales → TVA → facturation → frais → personne physique ou société → SRL → ISoc → rémunération de dirigeant → dividendes"
    situations: [devenir-independant, creer-societe]
