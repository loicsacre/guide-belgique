      - { slug: eau-maison, title: "L'eau : arrivée, compteur, évacuation" }
      - { slug: chauffage-maison, title: "Le chauffage central : chaudière, radiateurs, thermostat" }
      - { slug: eau-chaude-sanitaire, title: "L'eau chaude sanitaire" }
      - { slug: pompe-a-chaleur, title: "La pompe à chaleur" }
      - { slug: ventilation-maison, title: "La ventilation" }
