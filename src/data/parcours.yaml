# Les chapitres du manuel, dans l'ordre du sommaire. Chaque chapitre a sa page (/chapitres/<id>/).
#   id, emoji, title          identifiant d'URL, icône, titre affiché
#   intro                     une ligne : de quoi parle le chapitre
#   presentation              un paragraphe : ce qu'on va découvrir et pourquoi ces notions sont liées
#   fil                       la chaîne des notions, en une ligne (facultatif)
#   situations                mises en situation qui appliquent le chapitre (slugs de situations/)
#   notions                   les fiches, dans un ordre de lecture possible (jamais obligatoire)
# Le quiz facultatif d'un chapitre est dans src/data/quiz/<id>.yaml.
# Une notion listée ici sans fiche apparaît "à rédiger" (glossaire, sommaire, wiki-links).
blocs:
  - id: belgique
    emoji: "🏛️"
    title: "Comment fonctionne la Belgique"
    intro: "Qui décide de quoi, et à qui s'adresser."
    presentation: "Avant de parler salaire, impôts ou logement, il faut savoir qui tient quel bout du système. La Belgique répartit ses compétences entre l'État fédéral, les Régions, les Communautés et les communes, et confie beaucoup de missions à des organismes aux sigles opaques. Ce chapitre pose le décor : les acteurs, la sécurité sociale qui finance une grande partie de ta vie, et les outils (eID, MyMinfin) par lesquels tu leur parles."
    fil: "Fédéral, Régions, communes → administrations et organismes → sécurité sociale → ONSS, mutualité → ton domicile et ton identité numérique"
    situations: []
    notions:
      - { slug: qui-fait-quoi, title: Qui fait quoi en Belgique ? }
      - { slug: administrations-et-organismes, title: "Administrations et organismes publics (SPF, ONSS, INAMI, ONEM…)" }
      - { slug: securite-sociale, title: Sécurité sociale }
      - { slug: onss, title: ONSS }
      - { slug: domicile, title: Domicile, résidence et registre national }
      - { slug: identite-numerique, title: "Identité numérique (eID, itsme, MyMinfin, eBox)" }
      - { slug: mutualite, title: Mutualité et assurance soins de santé }
  - id: travail
    emoji: "💼"
    title: "Travail et salaire"
    intro: "Du contrat signé à l'argent reçu sur ton compte."
    presentation: "Le salaire annoncé n'est jamais celui que tu reçois. Entre les deux passent des cotisations sociales, une avance d'impôt et parfois des avantages qui ne sont pas de l'argent. Ce chapitre suit ce chemin, explique pourquoi chaque prélèvement existe, puis élargit : ta commission paritaire, l'indexation, les congés, et ce qui se passe quand le travail s'arrête (maladie, chômage, pension)."
    fil: "Contrat → commission paritaire → salaire brut → cotisations ONSS → précompte professionnel → salaire net → fiche de paie → indexation"
    situations: [premier-emploi, premiere-fiche-de-paie]
    notions:
      - { slug: emploi-salarie, title: Comment fonctionne un emploi salarié ? }
      - { slug: contrat-de-travail, title: Contrat de travail }
      - { slug: commission-paritaire, title: Commission paritaire et CCT }
      - { slug: salaire-brut, title: Salaire brut }
      - { slug: cout-employeur, title: Coût employeur et cotisations patronales }
      - { slug: cotisations-sociales, title: Cotisations sociales }
      - { slug: precompte-professionnel, title: Précompte professionnel }
      - { slug: salaire-net, title: Salaire net }
      - { slug: fiche-de-paie, title: Fiche de paie }
      - { slug: avantages-extralegaux, title: Avantages extralégaux }
      - { slug: voiture-de-societe, title: Voiture de société et ATN }
      - { slug: pecule-de-vacances, title: Pécule de vacances et congés }
      - { slug: treizieme-mois, title: 13e mois (prime de fin d'année) et bonus }
      - { slug: indexation, title: Indexation des salaires }
      - { slug: preavis-licenciement, title: Préavis, démission et licenciement }
      - { slug: chomage, title: Chômage }
      - { slug: incapacite-de-travail, title: Maladie et incapacité de travail }
      - { slug: pension, title: Pension légale et complémentaire }
  - id: impots
    emoji: "🧾"
    title: "Les impôts"
    intro: "De l'avance retenue chaque mois au décompte final."
    presentation: "L'impôt sur le revenu se paie deux fois en apparence : une avance chaque mois, puis un décompte l'année suivante. Ce chapitre explique comment on passe de tes revenus à un revenu imposable, pourquoi le taux augmente par tranches, ce qui le réduit, et comment lire le résultat final, l'avertissement-extrait de rôle."
    fil: "Revenus → revenu imposable → tranches et quotité exemptée → déductions et réductions → additionnels communaux → déclaration → AER"
    situations: [declaration-fiscale]
    notions:
      - { slug: impot-taxe-cotisation, title: "Impôt, taxe, cotisation, redevance : quelle différence ?" }
      - { slug: ipp, title: Impôt des personnes physiques (IPP) }
      - { slug: annee-revenus-exercice, title: Année des revenus et exercice d'imposition }
      - { slug: revenu-imposable, title: Revenu imposable }
      - { slug: categories-de-revenus, title: "Les quatre catégories de revenus (professionnels, immobiliers, mobiliers, divers)" }
      - { slug: tranches-imposition, title: Tranches d'imposition et taux marginal }
      - { slug: quotite-exemptee, title: Quotité exemptée d'impôt }
      - { slug: personne-a-charge, title: Personne à charge }
      - { slug: deduction-reduction-credit, title: "Déduction, réduction, crédit d'impôt" }
      - { slug: centimes-additionnels, title: Additionnels communaux et régionaux }
      - { slug: declaration-fiscale, title: Déclaration fiscale }
      - { slug: avertissement-extrait-de-role, title: Avertissement-extrait de rôle (AER) }
      - { slug: precompte-mobilier, title: Précompte mobilier }
  - id: argent
    emoji: "💰"
    title: "L'argent au quotidien"
    intro: "Revenus, dépenses, réserve et patrimoine."
    presentation: "Avant les produits bancaires, quelques idées simples organisent toute la gestion de l'argent : ce qui rentre et ce qui sort, la réserve qui évite les crédits subis, l'inflation qui grignote la valeur, le taux d'intérêt qui est le prix du temps, et le patrimoine qui fait le bilan de tout ça."
    fil: "Budget → épargne de précaution → inflation → taux d'intérêt → rendement, risque, liquidité → patrimoine net"
    situations: []
    notions:
      - { slug: budget, title: Budget personnel }
      - { slug: epargne-de-precaution, title: Épargne de précaution }
      - { slug: inflation, title: Inflation et pouvoir d'achat }
      - { slug: taux-interet, title: Taux d'intérêt }
      - { slug: patrimoine-net, title: "Patrimoine net : actifs − dettes" }
      - { slug: rendement-risque-liquidite, title: "Rendement, risque, liquidité" }
  - id: banque
    emoji: "🏦"
    title: "Banque et paiements"
    intro: "Les comptes, les paiements et leur sécurité."
    presentation: "Ton compte à vue est le carrefour de presque toute ta vie financière. Ce chapitre explique les différents comptes, les paiements qui partent tout seuls, ce qui protège ton argent si la banque tombe, et les arnaques qui visent ce carrefour."
    fil: "Compte à vue → compte d'épargne → domiciliations et ordres permanents → garantie des dépôts → fraude et phishing"
    situations: []
    notions:
      - { slug: compte-a-vue, title: Compte à vue, cartes et paiements }
      - { slug: compte-epargne, title: Compte d'épargne réglementé }
      - { slug: domiciliation-ordre-permanent, title: Domiciliation et ordre permanent }
      - { slug: garantie-des-depots, title: Garantie des dépôts }
      - { slug: fraude-phishing, title: Fraude, phishing et sécurité bancaire }
  - id: credit
    emoji: "💳"
    title: "Le crédit"
    intro: "Emprunter : ce que ça coûte vraiment, et comment comparer."
    presentation: "Un crédit, c'est acheter aujourd'hui avec l'argent de demain, et payer pour ce décalage. Ce chapitre décompose ce prix (taux, frais, durée), montre comment se construit une mensualité, puis passe au crédit le plus important d'une vie, le crédit hypothécaire, avec ses garanties."
    fil: "Capital, intérêts, durée → taux fixe ou variable → TAEG → mensualité et amortissement → crédit hypothécaire → quotité → hypothèque"
    situations: [premier-credit, premiere-voiture]
    notions:
      - { slug: credit, title: "Crédit : capital, intérêts, durée" }
      - { slug: taux-fixe-variable, title: Taux fixe et taux variable }
      - { slug: taeg, title: TAEG }
      - { slug: mensualite-amortissement, title: Mensualité et tableau d'amortissement }
      - { slug: credit-hypothecaire, title: Crédit hypothécaire }
      - { slug: quotite-emprunt, title: Quotité d'emprunt, apport personnel et capacité d'emprunt }
      - { slug: hypotheque, title: Hypothèque, garanties et caution }
      - { slug: credit-consommation, title: Crédit à la consommation et endettement }
  - id: immobilier
    emoji: "🏠"
    title: "Le logement : louer, acheter"
    intro: "Louer, acheter, et tout ce qui vient avec un logement."
    presentation: "Le logement est souvent la plus grosse dépense d'une vie, et il touche à beaucoup de domaines à la fois : contrats, notaire, fiscalité régionale, crédit. Ce chapitre suit l'ordre de la vie : louer, choisir d'acheter, payer bien plus que le prix affiché, puis vivre propriétaire avec ses impôts et ses voisins de copropriété."
    fil: "Louer ou acheter → bail et garantie locative → coût réel d'acquisition → compromis → notaire → droits d'enregistrement → revenu cadastral → précompte immobilier"
    situations: [louer-un-logement, acheter-un-logement]
    notions:
      - { slug: louer-vs-acheter, title: Louer ou acheter ? }
      - { slug: bail, title: Bail de résidence principale }
      - { slug: garantie-locative, title: Garantie locative et état des lieux }
      - { slug: indexation-loyer, title: Indexation du loyer et charges locatives }
      - { slug: cout-reel-achat, title: "Prix d'achat vs coût réel d'acquisition" }
      - { slug: compromis, title: Compromis de vente }
      - { slug: notaire-acte-authentique, title: Notaire et acte authentique }
      - { slug: droits-enregistrement, title: Droits d'enregistrement }
      - { slug: revenu-cadastral, title: Revenu cadastral }
