  - id: renovation
    emoji: "🔨"
    title: "Rénover sa maison"
    intro: "Diagnostiquer, ordonner, budgéter, faire faire, réceptionner, entretenir."
    presentation: "Rénover, c'est d'abord décider dans quel ordre agir et avec quel argent. Ce chapitre suit un chantier du diagnostic à la réception : l'audit, l'ordre des travaux, le budget et les primes, le permis, le choix de l'entrepreneur et la lecture du devis, puis l'entretien."
