  - id: epargne
    emoji: "📈"
    title: "Épargner et investir"
    intro: "Faire travailler l'argent dont tu n'as pas besoin tout de suite."
    presentation: "Épargner, c'est mettre de côté ; investir, c'est accepter un risque pour espérer un rendement. Ce chapitre explique la mécanique du temps (intérêts composés), les grandes familles de placements, pourquoi on diversifie, ce que l'État prélève au passage, et les régimes avantagés comme l'épargne-pension."
    fil: "Intérêts composés → actions, obligations, ETF → diversification et horizon → fiscalité → épargne-pension"
    situations: [premier-investissement]
    notions:
      - { slug: interets-composes, title: Intérêts composés }
      - { slug: actions-obligations-etf, title: "Actions, obligations, fonds et ETF" }
      - { slug: diversification, title: Diversification et horizon de placement }
      - { slug: fiscalite-investissements, title: Fiscalité des investissements }
      - { slug: epargne-pension, title: Épargne-pension et pension complémentaire }
  - id: assurances
    emoji: "☂️"
    title: "Les assurances"
    intro: "Payer un peu chaque année pour ne pas tout perdre un jour."
    presentation: "Une assurance mutualise un risque : beaucoup paient une prime pour que quelques-uns soient indemnisés. Une fois ce principe compris, chaque contrat (familiale, habitation, auto, hospitalisation, solde restant dû) se lit avec les mêmes mots : prime, franchise, sinistre, exclusion."
    fil: "Prime, franchise, sinistre → RC familiale → habitation → auto → hospitalisation → solde restant dû"
    situations: [premiere-voiture]
    notions:
      - { slug: assurance-principes, title: "Assurance : prime, franchise, sinistre, exclusion" }
      - { slug: rc-familiale, title: Responsabilité civile et RC familiale }
      - { slug: assurance-habitation, title: Assurance habitation (incendie) }
      - { slug: assurance-auto, title: Assurance auto (RC, omnium) }
      - { slug: assurance-hospitalisation, title: Assurance hospitalisation }
      - { slug: assurance-solde-restant-du, title: Assurance solde restant dû et assurance-vie }
  - id: famille
    emoji: "👨‍👩‍👧"
    title: "Famille et patrimoine"
    intro: "Vivre à deux, transmettre, hériter."
    presentation: "Le statut de ton couple change ce qui est à toi, ce qui est commun et ce qui se passe à la séparation ou au décès. Ce chapitre relie les formes de couple, les régimes matrimoniaux, la succession et la donation, avec leurs impôts qui varient d'une Région à l'autre."
    fil: "Formes de couple → régime matrimonial → succession → droits de succession → donation"
    situations: [mise-en-couple, naissance-enfant, separation, deces-proche]
    notions:
      - { slug: formes-de-couple, title: "Mariage, cohabitation légale, cohabitation de fait" }
      - { slug: regime-matrimonial, title: Régime matrimonial et séparation }
