  - id: maison
    emoji: "🔧"
    title: "Comprendre sa maison"
    intro: "Du réseau au compteur, du compteur à l'appareil, de l'appareil à la facture."
    presentation: "Une maison est un système de sous-systèmes : électricité, eau, chauffage, ventilation, enveloppe. Ils suivent tous la même logique, du réseau public à ta facture, et l'enveloppe décide de l'énergie que tu dois acheter. Ce chapitre les parcourt un par un, en disant chaque fois qui est responsable de quoi."
    fil: "Réseau → compteur → installation → appareils → consommation → facture ; enveloppe et ventilation décident du reste"
    situations: [comprendre-ma-maison]
    notions:
