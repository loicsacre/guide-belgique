  - id: vie-pratique
    emoji: "🚗"
    title: "Vie pratique"
    intro: "Contrats du quotidien, voiture, énergie, démarches."
    presentation: "Des sujets plus courts, rencontrés tôt ou tard : tes droits quand tu achètes, les taxes d'une voiture, la facture d'énergie, et à qui t'adresser quand une administration bloque."
    fil: "Contrats de consommation → voiture et taxes → énergie → problème administratif"
