# Quiz facultatif du chapitre « Indépendant et société » (id : entreprise, src/data/parcours.yaml).
# Il mélange les notions du chapitre. Format : voir CONTENT_MODEL.md, section Quiz.
titre: Indépendant et société, qu'as-tu retenu ?
questions:
  - id: ca-revenu
    type: qcm
    savoir: comprendre
    question: Une indépendante facture 60 000 € hors TVA sur l'année. Que représente ce montant ?
    choix:
      - Son revenu, sur lequel elle paiera l'impôt
      - Son chiffre d'affaires, dont il faut encore retirer les frais, les cotisations sociales et l'impôt
      - Son bénéfice net, déjà taxé
      - Le montant de sa pension future
    reponse: 1
    explication: 'Ce qu''on facture, c''est le chiffre d''affaires. On en retire les frais professionnels pour obtenir le bénéfice, puis les cotisations sociales, puis l''impôt. Ce qui reste disponible est nettement plus bas que le montant facturé.'
    notions: [independant, chiffre-affaires-marge-benefice]

  - id: tva-a-qui
    type: vrai-faux
    savoir: comprendre
    question: '« La TVA que je facture à mes clients fait partie de mes revenus. »'
    reponse: false
    explication: 'Faux. L''indépendant collecte la TVA pour l''État : il l''ajoute à ses factures, déduit celle qu''il a payée sur ses achats, et reverse la différence lors de sa déclaration. C''est pourquoi on conseille de la garder sur un compte séparé.'
    notions: [tva]

  - id: cotisations-provisoires
    type: vrai-faux
    savoir: comprendre
    question: '« Les cotisations sociales de ma première année d''indépendant sont calculées sur mes revenus réels de cette année-là. »'
    reponse: false
    explication: 'Faux. Au début, la caisse d''assurances sociales réclame des cotisations provisoires, faute de connaître tes revenus. Elles sont régularisées plus tard, quand l''administration fiscale communique le revenu réel. Si l''activité marche bien, la régularisation peut être lourde : d''où l''intérêt d''adapter tes provisoires dès que possible.'
    notions: [cotisations-independant]

  - id: amortissement-ordinateur
    type: vrai-faux
    savoir: calculer
    question: '« Un ordinateur acheté pour l''activité se déduit en entier l''année de l''achat. »'
    reponse: false
    explication: 'Faux en général. Un bien qu''on utilise plusieurs années est amorti : son coût est réparti sur sa durée d''utilisation, et seule une part est déduite chaque année.'
    notions: [frais-professionnels, amortissement-comptable]

  - id: ca-benefice
    type: qcm
    savoir: calculer
    question: 'Une SRL réalise 100 000 € de chiffre d''affaires et a 70 000 € de charges. Quel est son bénéfice avant impôt ?'
    choix: ['100 000 €', '70 000 €', '30 000 €', 'Impossible à savoir']
    reponse: 2
    explication: 'Le chiffre d''affaires, ce sont les ventes. On en retire les charges (achats, loyers, rémunérations, amortissements) pour obtenir le résultat. 100 000 − 70 000 = 30 000 €. C''est sur ce montant, pas sur les ventes, que l''impôt des sociétés est calculé.'
    notions: [chiffre-affaires-marge-benefice, impot-des-societes]

  - id: capital-minimum
    type: vrai-faux
    savoir: comprendre
    question: '« Pour créer une SRL, il faut un capital minimum de 18 550 €. »'
    reponse: false
    explication: 'Faux depuis le Code des sociétés et des associations de 2019. Il n''y a plus de capital minimum, mais des fonds propres suffisants pour l''activité prévue, justifiés par un plan financier sur deux ans. S''ils étaient manifestement insuffisants et que la société fait faillite dans les trois ans, les fondateurs peuvent en répondre personnellement.'
    notions: [actif-passif-bilan]

  - id: ou-est-le-gain
    type: qcm
    savoir: comprendre
    question: 'D''où vient l''avantage fiscal d''une société par rapport à la personne physique ?'
    choix:
      - La société ne paie pas de cotisations sociales
      - Le bénéfice laissé dans la société est taxé à 20-25 % au lieu de 50 %
      - Tout ce que la société dépense est déductible
      - Les dividendes ne sont pas taxés
    reponse: 1
    explication: 'Le gain vient du bénéfice que tu ne sors pas. Laissé dans la société, il est taxé à l''impôt des sociétés (20 % ou 25 %) au lieu des tranches les plus hautes de l''IPP. Dès que tu le sors, il est taxé une seconde fois. Si tu as besoin de tout pour vivre, la société coûte plus qu''elle ne rapporte.'
    notions: [personne-physique-vs-societe, tranches-imposition]

  - id: ordre-creation
    type: ordre
    savoir: faire
    question: 'Remets les étapes de création d''une SRL dans l''ordre.'
    ordre:
      - Faire établir le plan financier
      - Verser les apports sur un compte bloqué
      - Signer l'acte chez le notaire
      - Recevoir le numéro d'entreprise (BCE)
      - Inscrire les bénéficiaires au registre UBO
      - Déposer les premiers comptes annuels
    explication: 'Le plan financier et l''attestation bancaire sont remis au notaire le jour de l''acte. L''acte fait naître la société, qui reçoit ensuite son numéro BCE. Le registre UBO se remplit dans le mois. Les comptes annuels arrivent après la clôture du premier exercice.'
    notions: [notaire-acte-authentique, bce-numero-entreprise]

  - id: isoc-calcul
    type: nombre
    savoir: calculer
    question: 'Une petite SRL qui remplit les conditions du taux réduit a 40 000 € de bénéfice imposable. Combien d''impôt des sociétés paie-t-elle ?'
    reponse: 8000
    unite: €
    tolerance: 0
    explication: 'Les premiers 100 000 € de bénéfice d''une petite société sont taxés à 20 % si les conditions sont remplies. 40 000 × 20 % = 8 000 €. Sans le taux réduit, ce serait 25 %, soit 10 000 €.'
    notions: [impot-des-societes]


  - id: cuisine
    type: qcm
    savoir: reagir
    question: 'Ta SRL a 40 000 € sur son compte. Tu paies ta nouvelle cuisine avec. Qu''est-ce qui vient de se passer ?'
    choix:
      - Rien, c'est ta société, c'est ton argent
      - Tu as emprunté de l'argent à ta société
      - La cuisine devient déductible
      - La société a payé un dividende exonéré
    reponse: 1
    explication: 'L''argent de la société n''est pas le tien. Tu lui dois maintenant 40 000 € (un compte courant débiteur). Elle doit te facturer des intérêts, sinon le fisc calcule des intérêts fictifs taxés chez toi comme un avantage, et il peut requalifier le tout en rémunération ou en dividende. La bonne voie, c''est de te verser une rémunération ou un dividende.'
    notions: [compte-courant-associe]

  - id: dividende-net
    type: nombre
    savoir: calculer
    question: 'Ta société te verse un dividende brut de 10 000 € au précompte mobilier normal. Combien arrive sur ton compte ?'
    reponse: 7000
    unite: €
    tolerance: 0
    explication: 'Le précompte mobilier normal est de 30 %. La société le retient et le verse à l''État, c''est un impôt définitif. 10 000 − 3 000 = 7 000 €. Les petites sociétés ont accès à des taux réduits sous conditions (VVPR-bis, réserve de liquidation).'
    notions: [dividendes, precompte-mobilier]

  - id: comptes-publics
    type: vrai-faux
    savoir: verifier
    question: '« Les comptes annuels de ta SRL sont confidentiels : seuls toi, ton comptable et le fisc les voient. »'
    reponse: false
    explication: 'Ils sont déposés à la Banque nationale et deviennent publics. Clients, concurrents ou banques peuvent consulter ton bilan et ton résultat.'
    notions: [actif-passif-bilan]

  - id: caution
    type: qcm
    savoir: reagir
    question: 'La banque prête 50 000 € à ta SRL et te demande de signer une caution personnelle. Si la société ne rembourse pas, ta maison est-elle protégée par la responsabilité limitée ?'
    choix:
      - Oui, la responsabilité limitée protège tout ton patrimoine privé
      - Non, la caution t'engage personnellement envers la banque
      - Oui, sauf si tu es marié·e
      - Seulement si le prêt dépasse le capital
    reponse: 1
    explication: 'La responsabilité limitée protège ton patrimoine des dettes de la société. Une caution est un engagement personnel séparé, signé par toi. Si la société ne paie pas, la banque peut se retourner contre toi. Elle en demande presque toujours une aux petites sociétés.'
    notions: [personne-physique-vs-societe, responsabilite]
